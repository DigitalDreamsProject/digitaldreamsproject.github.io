<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stick Militia</title>
<meta name="description" content="Stick Militia - a 2D stick-figure fighting shooter with 100 levels.">

<body>

<canvas id="game" tabindex="0" width="896" height="596"></canvas>
